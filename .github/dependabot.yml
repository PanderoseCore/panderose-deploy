version: 2
updates:
  - package-ecosystem: npm
    directory: /docs-src
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-openapi-docs"
          - "docusaurus-theme-openapi-docs"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
