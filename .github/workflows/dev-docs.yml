name: Deploy dev docs (dev.panderose.com)

# Builds docs/ with Docusaurus and deploys it to its OWN Azure Static Web
# App resource (separate from the marketing-site SWA that serves
# panderose.com off /). Only runs when something under docs/ actually
# changes, so it doesn't fire on unrelated marketing-site commits.
#
# One-time setup this workflow depends on (not doable from a GitHub Action):
#   1. Create a second Azure Static Web App resource (e.g. "panderose-dev-docs"),
#      Free tier, NOT connected to GitHub during creation (choose "Other" /
#      skip the auto-generated workflow) so it doesn't clobber this file.
#   2. Copy its deployment token: SWA resource -> Overview -> "Manage
#      deployment token".
#   3. Add it as a repo secret named AZURE_STATIC_WEB_APPS_API_TOKEN_DEV_DOCS.
#   4. In the SWA resource -> Custom domains, add `dev.panderose.com`
#      (CNAME) and add the matching CNAME in Cloudflare DNS-only (grey
#      cloud), same pattern as MIGRATION-GUIDE.md used for the apex domain.
#   5. If/when the /docs/internal gate needs to be more than "any signed-in
#      user," configure Entra ID (or GitHub) auth + a custom role on the SWA
#      resource and update the "authenticated" role in docs/staticwebapp.config.json.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/dev-docs.yml']
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ['docs/**', '.github/workflows/dev-docs.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate API reference + build site
        working-directory: docs
        run: npm run build:ci

      - name: Package for Azure Static Web Apps
        working-directory: docs
        run: ./scripts/package-for-swa.sh

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV_DOCS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'docs/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview environment
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV_DOCS }}
          action: 'close'
